<!-- modals/obct_choice_modal.html -->
<div class="modal fade" id="obctChoiceModal" tabindex="-1" aria-labelledby="obctModalLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="obctModalLabel">Выбор объекта</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body bg-warning bg-opacity-25">
                <!-- Поиск -->
                <input type="text"
                       class="form-control mb-3"
                       placeholder="🔍 Поиск объекта..."
                       id="obctSearch"
                       onkeyup="filterObct()">

                <!-- Список складов -->
                <div id="obctList" style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-hover table-striped table-bordered">
                        <tbody>
                            {% for obct in obct_list %}
                            <tr style="cursor: pointer;"
                                onclick="selectObct({{ obct.id }}, '{{ obct.title|escapejs }}')">
                                <td>{{ obct.title }}</td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td class="text-center py-3">Нет складов</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
            </div>
        </div>
    </div>
</div>

<script>
function filterObct() {
    const searchText = document.getElementById('obctSearch').value.toLowerCase();
    const rows = document.querySelectorAll('#obctList tbody tr');
    rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(searchText) ? '' : 'none';
    });
}

function selectObct(id, title) {
    // Вызываем функцию из родительского шаблона
    if (window.selectObct) {
        window.selectObct(id, title);
    }
    $('#obctChoiceModal').modal('hide');
}
</script>
