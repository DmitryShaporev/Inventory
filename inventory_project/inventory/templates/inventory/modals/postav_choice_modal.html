<div class="modal fade " id="postavChoiceModal" tabindex="-1" aria-labelledby="postavModalLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-lg ">
        <div class="modal-content ">
            <div class="modal-header">
                <h5 class="modal-title" id="postavModalLabel">Выбор поставщика</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body bg-warning bg-opacity-25">
                <!-- Поиск -->
                <input type="text"
                       class="form-control mb-3"
                       placeholder="🔍 Поиск поставщика..."
                       id="postavSearch"
                       onkeyup="filterPostav()">

                <!-- Список поставщиков -->
                <div id="postavList" style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-hover table-striped table-bordered">
                        <tbody>
                            {% for postav in postav_list %}
                            <tr style="cursor: pointer;"
                                onclick="window.selectPostav({{ postav.id }}, '{{ postav.title|escapejs }}')">
                                <td>{{ postav.title }}</td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td class="text-center py-3">Нет поставщиков</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                <div class="mt-3 pt-2 border-top">
                    <button type="button" class="btn btn-warning w-100"
                            data-bs-toggle="modal"
                            data-bs-target="#addPostavModal"
                            onclick="$('#postavChoiceModal').modal('hide')">
                        + Добавить поставщика
                    </button>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
            </div>
        </div>
    </div>
</div>

<!-- Модалка для добавления нового поставщика -->
<div class="modal fade" id="addPostavModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Новый поставщик</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body bg-warning bg-opacity-25">
                <div class="mb-3">
                    <label class="form-label">Наименование</label>
                    <input type="text" class="form-control" id="newPostavName" placeholder="Введите наименование">
                </div>
            </div>
            <div class="modal-footer">

                <button type="button" class="btn btn-warning" id="saveNewPostavBtn">Сохранить</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
            </div>
        </div>
    </div>
</div>

<script>
// Глобальная функция выбора поставщика
window.selectPostav = function(id, title) {
    console.log('Выбран поставщик:', id, title);
    $('#postav_display').val(title);
    $('#postav_id').val(id);
    $('#postavChoiceModal').modal('hide');
};

function filterPostav() {
    const searchText = document.getElementById('postavSearch').value.toLowerCase();
    const rows = document.querySelectorAll('#postavList tbody tr');
    rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(searchText) ? '' : 'none';
    });
}
</script>
