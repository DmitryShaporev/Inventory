<table class="table table-bordered mb-0">
    <thead class="table-light">
        <tr>
            <th>Наименование</th>
            <th style="width: 60px" class="text-center"></th>
        </tr>
    </thead>
    <tbody id="search-results-tbody">  <!-- Добавлен id -->
        {% for item in data %}
        <tr id="row-{{ section }}-{{ item.id }}">
            <td style="cursor: pointer;"
                hx-get="{% url 'edit_spr_row' section item.id %}"
                hx-target="#modal-content"
                data-bs-toggle="modal"
                data-bs-target="#editModal">
                {{ item.title }}
            </td>
            <td class="text-center">
                <span style="cursor: pointer; color: #dc3545;"
                      hx-delete="{% url 'delete_spr_row' section item.id %}"
          hx-target="#row-{{ section }}-{{ item.id }}"
          hx-swap="outerHTML"
          hx-confirm="Удалить запись '{{ item.title }}'?">
        ✕
                </span>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2" class="text-center py-4 text-secondary">
                Ничего не найдено

            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
