{% extends 'inventory/base.html' %}

{% block content %}
<div class="row">
    <!-- Левый отступ (пустой) -->
    <div class="col-md-2">
    </div>

    <!-- Основной контент -->
    <div class="col-md-8 mt-4">
        <!-- Заголовок и кнопка в одной строке с меньшим отступом -->
        <div class="d-flex justify-content-between align-items-start mb-2">
    <h4 class="mb-0">{{ title }}</h4>

    <!-- Контейнер для поиска и кнопки (прижаты друг к другу) -->
    <div class="d-flex">
        <input type="text" class="form-control form-control-sm"
               placeholder="Поиск" style="width: 400px; border-top-right-radius: 1; border-bottom-right-radius: 1;">
        <button type="button" class="btn btn-success btn-sm p-0"
        style="width: 60px; height: 33px; margin-top: 0px; margin-left: 12px; border-top-left-radius: 1; border-bottom-left-radius: 1; display: flex; align-items: center; justify-content: center;">
    +
</button>
    </div>
</div>

        <!-- Таблица -->
        <table class="table table-bordered table-hover">
            <thead class="table-light">
                <tr>
                    <th>Наименование</th>
                    <th style="width: 60px" class="text-center"></th>
                </tr>
            </thead>
            <tbody>
                {% for item in data %}
                <tr>
                    <td>
                        <a href="edit/{{ item.id }}/" class="text-dark text-decoration-none">
                            {{ item.title }}
                        </a>
                    </td>
                    <td class="text-center">
                        <a href="delete/{{ item.id }}/" class="text-dark text-decoration-none">✕</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="text-center py-3">
                        Нет записей. <a href="#" class="text-success text-decoration-none">Добавить</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Правый отступ (пустой) -->
    <div class="col-md-2">
    </div>
</div>
{% endblock %}
