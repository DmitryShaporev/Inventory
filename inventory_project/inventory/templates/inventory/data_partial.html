{% if items %}
    <div class="list-group">
        {% for item in items %}
        <div class="list-group-item">
            <div class="d-flex w-100 justify-content-between">
                <h5 class="mb-1">{{ item.name }}</h5>
                <small>ID: {{ item.id }}</small>
            </div>
        </div>
        {% endfor %}
    </div>
{% else %}
    <div class="alert alert-info">Нет данных</div>
{% endif %}
