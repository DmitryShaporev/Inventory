{% extends 'inventory/base.html' %}
{% load static %}

{% block extra_css %}
<style>
    .filter-panel {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
    }

    .supplier-table {
        width: 100%;
        border-collapse: collapse;
    }

    .supplier-table th {
        background-color: #e9ecef;
        padding: 10px;
        text-align: center;
        border: 1px solid #dee2e6;
    }

    .supplier-table td {
        padding: 10px;
        border: 1px solid #dee2e6;
        vertical-align: middle;
    }

    .supplier-table tr:hover {
        background-color: #f0f7ff;
    }

    .total-summary {
        background: #e9ecef;
        padding: 10px 15px;
        margin-bottom: 20px;
        border-radius: 4px;
        font-weight: bold;
    }

    .doc-link {
        cursor: pointer;
        font-size: 18px;
        text-decoration: none;
    }

    .doc-link:hover {
        opacity: 0.7;
    }

    @media print {
        .no-print {
            display: none !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid mt-3">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">📊 Отчет по поставщикам</h4>
            </div>

           <!-- Панель фильтров -->
<div class="filter-panel no-print bg-warning bg-opacity-25">
    <div class="row g-2 align-items-end">
        <div class="col-auto">
            <label class="form-label">Дата начала</label>
            <input type="date" class="form-control" id="dateStart" value="{{ date_start|default:'' }}" style="width: 150px;">
        </div>
        <div class="col-auto">
            <label class="form-label">Дата конца</label>
            <input type="date" class="form-control" id="dateEnd" value="{{ date_end|default:'' }}" style="width: 150px;">
        </div>
        <div class="col-auto">
            <label class="form-label"></label>
            <div class="d-flex gap-2">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="dateType" id="dateTypeCreated" value="created" checked>
                    <label class="form-check-label" for="dateTypeCreated">По дате поступления</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="dateType" id="dateTypeDoc" value="doc">
                    <label class="form-check-label" for="dateTypeDoc">По дате документа </label>
                </div>
            </div>
        </div>
        <div class="col-auto flex-grow-1">
            <label class="form-label"> 🔍 Поиск</label>
            <input type="text" class="form-control" id="supplierSearch" placeholder="Поставщик..." style="width: 400px;">
        </div>
        <div class="col-auto">
            <button class="btn btn-warning" id="btnShow">📋 Сформировать отчет</button>
        </div>

        <div class="col-auto">
            <button class="btn btn-secondary" id="btnPrint">🖨️ Печать</button>
        </div>
        <div class="col-auto">
            <button class="btn btn-secondary" id="btnExcel">📊 Excel</button>
        </div>
    </div>
</div>
            <!-- Результаты отчета -->
            <div id="reportContent">
                {% include 'inventory/reports/supplier_report_table.html' %}
            </div>
        </div>
    </div>
</div>

<script src="{% static 'jquery.js' %}"></script>
<script>
$(document).ready(function() {
    $('#btnShow').on('click', function() { loadReport(); });
    $('#btnPrint').on('click', function() { window.print(); });
    $('#btnExcel').on('click', function() { exportToExcel(); });

    // Поиск
    $(document).on('keyup', '#supplierSearch', function() {
        const searchText = $(this).val().toLowerCase().trim();
        const rows = $('.supplier-table tbody tr');

        if (searchText === '') {
            rows.show();
        } else {
            rows.each(function() {
                const $row = $(this);
                const title = $row.find('td:nth-child(2)').text().toLowerCase();
                if (title.includes(searchText)) {
                    $row.show();
                } else {
                    $row.hide();
                }
            });
        }
    });

    function loadReport() {
        const dateStart = $('#dateStart').val();
        const dateEnd = $('#dateEnd').val();
        const dateType = $('input[name="dateType"]:checked').val();

        $.ajax({
            url: '/reports/suppliers/',
            method: 'GET',
            data: {
                date_start: dateStart,
                date_end: dateEnd,
                date_type: dateType
            },
            success: function(response) {
                $('#reportContent').html(response);
                $('#supplierSearch').val('');
            },
            error: function(xhr) {
                alert('Ошибка загрузки отчета: ' + xhr.responseText);
            }
        });
    }

    function exportToExcel() {
        const dateStart = $('#dateStart').val();
        const dateEnd = $('#dateEnd').val();
        const dateType = $('input[name="dateType"]:checked').val();

        window.location.href = `/reports/suppliers/excel/?date_start=${dateStart}&date_end=${dateEnd}&date_type=${dateType}`;
    }
});
</script>
{% endblock %}
